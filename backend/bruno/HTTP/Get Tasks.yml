info:
  name: Get Tasks
  type: http
  seq: 1

http:
  method: GET
  url: "{{BASE_URL}}/api/tasks"
  params:
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "20"
      type: query
    - name: status
      value: "{{?status}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
